name: Cloud-Native CI/CD (Test & Deploy to Public Cloud)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test-and-verify:
    name: Run Automated Tests & Packaging Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install system OCR packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-vie

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-deploy.txt pytest httpx

      - name: Run full test suite
        env:
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: "1"
        run: python -m pytest -q

      - name: Verify decoupled cloud deployment bundle
        run: |
          python scripts/deploy_cloud.py --mode decoupled --dry-run
          python scripts/deploy_cloud.py --mode standalone --dry-run

  deploy-huggingface-space:
    name: Deploy Decoupled Runtime to Hugging Face Space
    needs: test-and-verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && secrets.HF_TOKEN != ''
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install huggingface_hub
        run: pip install --no-cache-dir huggingface_hub

      - name: Deploy code and sync secrets
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          APP_ADMIN_PASSWORD: ${{ secrets.APP_ADMIN_PASSWORD }}
          APP_SECRET_KEY: ${{ secrets.APP_SECRET_KEY }}
          HF_STORAGE_REPO: ${{ secrets.HF_STORAGE_REPO }}
        run: |
          python scripts/deploy_cloud.py --mode decoupled --sync-secrets
